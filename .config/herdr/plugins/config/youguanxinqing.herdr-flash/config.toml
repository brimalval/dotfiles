# Herdr Flash — youguanxinqing/herdr-flash
# Rose Pine Moon palette to match the herdr theme — https://rosepinetheme.com/palette
[colors]
unmatched = { fg = "#6e6a86" }                            # muted
match = { fg = "#232136", bg = "#9ccfd8" }                # base on foam
label = { fg = "#232136", bg = "#eb6f92", bold = true }   # base on love
selection = { bg = "#44415a" }                            # highlight med
cursor = { fg = "#232136", bg = "#e0def4" }               # base on text
