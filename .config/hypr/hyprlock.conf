# Lock screen: blurred screenshot, clock, password field.
background {
    path = screenshot
    blur_passes = 3
}

label {
    text = $TIME
    font_size = 64
    font_family = Maple Mono NF
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    position = 0, -40
    halign = center
    valign = center
    placeholder_text = password
}
