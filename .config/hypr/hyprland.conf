# Hyprland, desktop PC. Linked to ~/.config/hypr/hyprland.conf by nix/links.nix; edits apply on save.
# Wiki: https://wiki.hypr.land  ·  Check for mistakes: `hyprctl configerrors`
#
# Keys mirror .aerospace.toml, with SUPER in place of alt: on a PC keyboard the Windows key sits where
# the Mac's option key does, so the same fingers do the same things. SUPER also stays out of games' way.

# --- Monitors ---
# Every monitor at its highest refresh rate, placed automatically. List them with `hyprctl monitors`, then
# pin each one, e.g.:  monitor = DP-1, 2560x1440@165, 0x0, 1
monitor = , highrr, auto, 1

# --- NVIDIA ---
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XCURSOR_SIZE,24

# --- Startup (uwsm app: runs each one as part of the session, so they stop when you log out) ---
exec-once = uwsm app -- waybar
exec-once = uwsm app -- mako
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- nm-applet --indicator
exec-once = uwsm app -- wl-paste --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent

# --- Look (AeroSpace had no gaps; same here) ---
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    col.active_border = rgba(c4a7e7ff)
    col.inactive_border = rgba(393552ff)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    animation = global, 1, 3, default
}

dwindle {
    preserve_split = true
}

misc {
    vrr = 2 # variable refresh rate (G-Sync/FreeSync) in fullscreen apps, i.e. games
    disable_hyprland_logo = true
    focus_on_activate = true
}

input {
    kb_layout = us
    follow_mouse = 1
    accel_profile = flat # no mouse acceleration: what games expect
    sensitivity = 0
}

# --- Apps ---
$terminal = kitty
$launcher = fuzzel

bind = SUPER, Return, exec, uwsm app -- $terminal
bind = SUPER, Space, exec, $launcher --launch-prefix="uwsm app -- "
bind = SUPER CTRL, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = SUPER, Escape, exec, hyprlock
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy                     # region → clipboard
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | satty --filename -      # region → annotate
bind = SUPER SHIFT, E, exec, uwsm stop                                    # log out

# --- Windows (AeroSpace: alt-...) ---
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

binde = SUPER, minus, resizeactive, -50 0
binde = SUPER, equal, resizeactive, 50 0

bind = SUPER, slash, togglesplit                 # alt-slash: flip horizontal/vertical
bind = SUPER, comma, togglegroup                 # alt-comma: accordion ≈ a tabbed group
bind = SUPER, period, changegroupactive, f       #   next tab in the group
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, togglefloating
bind = SUPER SHIFT, Q, killactive

bindm = SUPER, mouse:272, movewindow             # SUPER + drag: move
bindm = SUPER, mouse:273, resizewindow           # SUPER + right-drag: resize

# --- Workspaces: 1-9 and letters, as in AeroSpace (F, Q are taken by fullscreen and close) ---
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9

bind = SUPER, A, workspace, name:A
bind = SUPER, B, workspace, name:B
bind = SUPER, C, workspace, name:C
bind = SUPER, D, workspace, name:D
bind = SUPER, E, workspace, name:E
bind = SUPER, G, workspace, name:G
bind = SUPER, I, workspace, name:I
bind = SUPER, M, workspace, name:M
bind = SUPER, N, workspace, name:N
bind = SUPER, O, workspace, name:O
bind = SUPER, P, workspace, name:P
bind = SUPER, R, workspace, name:R
bind = SUPER, S, workspace, name:S
bind = SUPER, T, workspace, name:T
bind = SUPER, U, workspace, name:U
bind = SUPER, V, workspace, name:V
bind = SUPER, W, workspace, name:W
bind = SUPER, X, workspace, name:X
bind = SUPER, Y, workspace, name:Y
bind = SUPER, Z, workspace, name:Z
bind = SUPER SHIFT, A, movetoworkspacesilent, name:A
bind = SUPER SHIFT, B, movetoworkspacesilent, name:B
bind = SUPER SHIFT, C, movetoworkspacesilent, name:C
bind = SUPER SHIFT, D, movetoworkspacesilent, name:D
bind = SUPER SHIFT, G, movetoworkspacesilent, name:G
bind = SUPER SHIFT, I, movetoworkspacesilent, name:I
bind = SUPER SHIFT, M, movetoworkspacesilent, name:M
bind = SUPER SHIFT, N, movetoworkspacesilent, name:N
bind = SUPER SHIFT, O, movetoworkspacesilent, name:O
bind = SUPER SHIFT, P, movetoworkspacesilent, name:P
bind = SUPER SHIFT, R, movetoworkspacesilent, name:R
bind = SUPER SHIFT, S, movetoworkspacesilent, name:S
bind = SUPER SHIFT, T, movetoworkspacesilent, name:T
bind = SUPER SHIFT, U, movetoworkspacesilent, name:U
bind = SUPER SHIFT, V, movetoworkspacesilent, name:V
bind = SUPER SHIFT, W, movetoworkspacesilent, name:W
bind = SUPER SHIFT, X, movetoworkspacesilent, name:X
bind = SUPER SHIFT, Y, movetoworkspacesilent, name:Y
bind = SUPER SHIFT, Z, movetoworkspacesilent, name:Z

bind = SUPER, Tab, workspace, previous                        # alt-tab: back and forth
bind = SUPER SHIFT, Tab, movecurrentworkspacetomonitor, +1    # alt-shift-tab: workspace to next monitor

# --- Service mode (AeroSpace: alt-shift-semicolon) ---
bind = SUPER SHIFT, semicolon, submap, service
submap = service
bind = , Escape, exec, hyprctl reload
bind = , Escape, submap, reset
bind = , F, togglefloating
bind = , F, submap, reset
binde = , Up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binde = , Down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = SHIFT, Down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0
bind = SHIFT, Down, submap, reset
bind = , Q, submap, reset
submap = reset

# --- Media keys ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Window rules ---
# Game launchers and pop-ups that should float rather than tile go here. The rule syntax has changed
# across Hyprland releases, so copy the form from https://wiki.hypr.land/Configuring/Window-Rules/
# and find a window's class with `hyprctl clients`.
