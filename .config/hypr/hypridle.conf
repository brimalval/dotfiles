# Idle: lock after 10 min, screen off after 15, back on at any input. Games and video players that
# inhibit idle (most do) keep this from firing while you play.
# hyprctl dispatch takes Lua since Hyprland 0.57 (the old `dpms off` form errors out).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
